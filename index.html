<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MiniProgram & Weather</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    .tab-bar {
      display: flex;
      background: white;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
      background: #eff6ff;
    }
    .tab-btn:hover:not(.active) { background: #f8fafc; }

    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; color: #1e40af; margin-bottom: 12px; }
    .desc { font-size: 0.9rem; color: #64748b; margin-bottom: 16px; line-height: 1.6; }
    .rules-list { font-size: 0.85rem; color: #475569; padding-left: 18px; margin-bottom: 16px; }
    .rules-list li { margin-bottom: 4px; }
    .btn-run {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-run:hover { background: #1d4ed8; }
    .output-box {
      margin-top: 16px;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.8;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
    }

    .api-form { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .api-input {
      flex: 1;
      min-width: 180px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .api-input:focus { border-color: #2563eb; }
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .weather-card {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid #bfdbfe;
    }
    .weather-card .wdate { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .weather-card .wicon { font-size: 2rem; margin: 4px 0; }
    .weather-card .wtemp { font-size: 1.3rem; font-weight: 700; color: #1e40af; }
    .weather-card .wdesc { font-size: 0.75rem; color: #475569; margin-top: 2px; text-transform: capitalize; }
    .error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 10px; }
    .loading-msg { color: #64748b; font-size: 0.9rem; margin-top: 10px; }
    .catatan {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 10px;
      font-style: italic;
    }
    @media (max-width: 480px) {
      .weather-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      header h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function isPrime(n) {
  if (n < 2) return false;
  for (let i = 2; i <= Math.sqrt(n); i++) {
    if (n % i === 0) return false;
  }
  return true;
}

function Test1() {
  const [output, setOutput] = useState(null);

  function jalankan() {
    const arr = [];
    for (let i = 100; i >= 1; i--) {
      if (isPrime(i)) continue;
      if (i % 15 === 0) arr.push('FooBar');
      else if (i % 3 === 0) arr.push('Foo');
      else if (i % 5 === 0) arr.push('Bar');
      else arr.push(String(i));
    }
    setOutput(arr.join('  '));
  }

  return (
    <div className="card">
      <h2>Tes 1 - Program Kecil (Array 1-100)</h2>
      <p className="desc">
        Cetak angka 1-100 secara <strong>terbalik</strong>, horizontal, dengan aturan:
      </p>
      <ul className="rules-list">
        <li>Jangan cetak bilangan prima</li>
        <li>Kelipatan 3 - Foo</li>
        <li>Kelipatan 5 - Bar</li>
        <li>Kelipatan 3 dan 5 - FooBar</li>
      </ul>
      <button className="btn-run" onClick={jalankan}>Jalankan Program</button>
      {output && <div className="output-box">{output}</div>}
    </div>
  );
}

const WEATHER_ICONS = {
  'clear sky': '☀️', 'few clouds': '🌤️', 'scattered clouds': '⛅',
  'broken clouds': '☁️', 'overcast clouds': '☁️', 'shower rain': '🌧️',
  'rain': '🌧️', 'light rain': '🌦️', 'moderate rain': '🌧️',
  'heavy intensity rain': '⛈️', 'thunderstorm': '⛈️', 'snow': '❄️',
  'mist': '🌫️', 'haze': '🌫️', 'fog': '🌫️',
};
function getIcon(desc) {
  const lower = desc.toLowerCase();
  for (const [key, val] of Object.entries(WEATHER_ICONS)) {
    if (lower.includes(key)) return val;
  }
  return '🌡️';
}

const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function formatTanggal(dtStr) {
  const d = new Date(dtStr);
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
}

function Test2() {
  const [apiKey, setApiKey] = useState('');
  const [cuaca, setCuaca] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function ambilCuaca() {
    if (!apiKey.trim()) {
      setError('Masukkan API Key OpenWeatherMap kamu dulu.');
      return;
    }
    setLoading(true);
    setError('');
    setCuaca([]);
    try {
      const res = await axios.get(
        'https://api.openweathermap.org/data/2.5/forecast',
        {
          params: {
            q: 'Jakarta',
            appid: apiKey.trim(),
            units: 'metric',
            cnt: 40,
          }
        }
      );
      const seenDays = {};
      const hasil = [];
      for (const item of res.data.list) {
        const tanggal = item.dt_txt.split(' ')[0];
        if (!seenDays[tanggal]) {
          seenDays[tanggal] = true;
          hasil.push({
            tanggal: formatTanggal(item.dt_txt),
            suhu: Math.round(item.main.temp),
            deskripsi: item.weather[0].description,
            icon: getIcon(item.weather[0].description),
          });
        }
        if (hasil.length === 5) break;
      }
      setCuaca(hasil);
    } catch (e) {
      if (e.response && e.response.status === 401) {
        setError('API Key tidak valid. Pastikan kamu pakai key yang benar.');
      } else {
        setError('Gagal mengambil data cuaca. Cek koneksi atau API Key kamu.');
      }
    }
    setLoading(false);
  }

  return (
    <div className="card">
      <h2>Tes 2 - Prakiraan Cuaca Jakarta (5 Hari)</h2>
      <p className="desc">
        Masukkan API Key dari <strong>openweathermap.org</strong> untuk melihat prakiraan cuaca Jakarta 5 hari ke depan.
      </p>
      <div className="api-form">
        <input
          className="api-input"
          type="password"
          placeholder="Masukkan API Key OpenWeatherMap..."
          value={apiKey}
          onChange={e => setApiKey(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && ambilCuaca()}
        />
        <button className="btn-run" onClick={ambilCuaca}>Cek Cuaca</button>
      </div>
      <p className="catatan">* API Key tidak disimpan di source code (aman)</p>
      {loading && <p className="loading-msg">Mengambil data cuaca...</p>}
      {error && <p className="error-msg">{error}</p>}
      {cuaca.length > 0 && (
        <div className="weather-grid">
          {cuaca.map((c, i) => (
            <div className="weather-card" key={i}>
              <div className="wdate">{c.tanggal}</div>
              <div className="wicon">{c.icon}</div>
              <div className="wtemp">{c.suhu}°C</div>
              <div className="wdesc">{c.deskripsi}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('test1');
  return (
    <div>
      <header>
        <span style={{fontSize:'1.6rem'}}>💻</span>
        <h1>Mini Program & Prakiraan Cuaca</h1>
      </header>
      <div className="tab-bar">
        <button className={`tab-btn${tab === 'test1' ? ' active' : ''}`} onClick={() => setTab('test1')}>
          Tes 1 - Array 1-100
        </button>
        <button className={`tab-btn${tab === 'test2' ? ' active' : ''}`} onClick={() => setTab('test2')}>
          Tes 2 - Cuaca Jakarta
        </button>
      </div>
      <div className="container">
        {tab === 'test1' && <Test1 />}
        {tab === 'test2' && <Test2 />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
